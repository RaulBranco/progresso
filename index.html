.draft-status{color:#68766e;font-size:11px;font-weight:600}.form-actions{display:flex;align-items:center;gap:8px}.btn.secondary{color:#526158;background:#eef2ee}.home-weight-card{margin-top:14px}.home-weight-card .chart-wrap{height:220px}.compact-empty{padding:18px 0}.chart-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.chart-period{min-height:36px;padding:0 9px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:white;font:inherit;font-size:11px;font-weight:700}.chart-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.chart-summary>div{padding:9px 11px;border-radius:10px;background:#f4f7f4}.chart-summary span{display:block;color:var(--muted);font-size:10px}.chart-summary strong{display:block;margin-top:3px;color:var(--ink);font-size:17px}@media(max-width:650px){.chart-summary{grid-template-columns:1fr}.chart-summary>div{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px}.chart-summary>div span{grid-column:1/-1}.chart-summary>div small,.chart-summary>div .text-btn{grid-column:1/-1}}.chart-disclaimer{margin-top:10px;color:var(--muted);font-size:10px;line-height:1.45}.mobile-nav{overflow-x:auto;justify-content:stretch;scrollbar-width:none}.mobile-nav::-webkit-scrollbar{display:none}.mobile-nav button{flex:1 1 0;min-width:0;min-height:62px;white-space:normal;line-height:1.05}.content{min-width:0;overflow-x:hidden}.card,.chart-card,.form-card,.settings-card{max-width:100%;overflow:hidden}@media(max-width:360px){.mobile-nav button{min-width:0;font-size:8px}.mobile-nav button b{font-size:20px}.mobile-nav button span{font-size:10px}}.stat.is-action{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}.stat.is-action:hover,.stat.is-action:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px #18352a18;outline:2px solid #23695455;outline-offset:2px}</style>

<body>
<div class="app">
<aside class="side"><div class="brand"><span class="brand-mark">↘</span><span>Progresso<span>.</span></span></div><span class="side-label">Acompanhar</span><nav class="nav" id="sideNav"></nav><div class="side-spacer"></div><div class="privacy">▣ <span>Modo GitHub Pages<br><b>dados no aparelho.</b></span></div></aside>
<div class="main"><header class="top"><div class="top-user"><span class="avatar" id="avatar">P</span><span id="userName">seu progresso</span></div></header><main class="content" id="content"></main></div>
<nav class="mobile-nav" id="mobileNav"></nav></div><div id="toast" class="toast hide"></div>
<script src="./vendor/chart.umd.min.js"></script>
<script>
'use strict';
const KEYS={records:'progresso-fisico-registros-v2',settings:'progresso-fisico-config-v2',goals:'progresso-fisico-metas-v1',reminder:'progresso-fisico-lembrete-v1',water:'progresso-fisico-agua-v1',calories:'progresso-fisico-calorias-v1',mergeUndo:'progresso-fisico-merge-undo-v1',recordDraft:'progresso-fisico-rascunho-registro-v1'}; let charts={};
const state={view:'inicio',chartPeriod:'all',editingRecord:null,editingGoal:null,showGoalForm:false,records:load(KEYS.records,[]),settings:load(KEYS.settings,{}),goals:load(KEYS.goals,[]),water:load(KEYS.water,[]),calories:load(KEYS.calories,[]),mergeUndo:load(KEYS.mergeUndo,null),pendingMerge:null};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const js=s=>JSON.stringify(String(s??'')).replace(/[<>]/g,c=>c==='<'?'\u003c':'\u003e');
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}} function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{notice('Armazenamento indisponível neste navegador','error');return false}} function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)} function today(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)} function num(v){if(v===''||v==null)return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null} function n(v,d=2){return v==null?'—':new Intl.NumberFormat('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v)} function date(v,year=false){return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',...(year?{year:'numeric'}:{})}).format(new Date(v+'T12:00:00'))} function days(a,b){return Math.max(1,Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000))} function notice(msg,tone=''){const el=$('#toast');el.textContent=msg;el.className='toast '+tone;clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.className='toast hide',3000)}
function nutritionDay(dateValue=today()){const water=state.water.find(x=>x.date===dateValue)||{id:id(),date:dateValue,amountMl:0,targetMl:state.settings.waterTargetMl||2000};const calories=state.calories.find(x=>x.date===dateValue)||{id:id(),date:dateValue,consumedKcal:0,targetKcal:state.settings.calorieTargetKcal||2000,meals:[]};return{water,calories}} function upsertNutrition(dateValue,waterMl,kcal){const current=nutritionDay(dateValue);current.water.amountMl=Math.max(0,Math.round(waterMl??current.water.amountMl));current.water.targetMl=state.settings.waterTargetMl||current.water.targetMl||2000;current.calories.consumedKcal=Math.max(0,Math.round(kcal??current.calories.consumedKcal));current.calories.targetKcal=state.settings.calorieTargetKcal||current.calories.targetKcal||2000;state.water=[...state.water.filter(x=>x.date!==dateValue),current.water];state.calories=[...state.calories.filter(x=>x.date!==dateValue),current.calories];save(KEYS.water,state.water);save(KEYS.calories,state.calories)} function nutritionRing(pct,color){const safe=Math.max(0,Math.min(100,pct));return `<span class="nutrition-ring" style="--ring:${safe}%;--ring-color:${color}"><b>${safe}%</b></span>`} function nutritionPanel(){const x=nutritionDay(),w=x.water,c=x.calories,wp=w.targetMl?Math.min(100,Math.round(w.amountMl/w.targetMl*100)):0,cp=c.targetKcal?Math.min(100,Math.round(c.consumedKcal/c.targetKcal*100)):0;return `<section class="card nutrition-card"><div class="section-head"><div><span class="kicker">Hoje</span><h2>Água e calorias</h2></div><button class="text-btn" onclick="go('registrar')">Editar ›</button></div><div class="nutrition-grid"><div class="nutrition-item water"><div class="nutrition-top">${nutritionRing(wp,'#3a8ab0')}<div><b>Hidratação</b><small>${n(w.amountMl,0)} / ${n(w.targetMl,0)} ml</small></div></div><div class="quick-actions"><button onclick="quickWater(250)">+250 ml</button><button onclick="quickWater(500)">+500 ml</button></div></div><div class="nutrition-item calories"><div class="nutrition-top">${nutritionRing(cp,'#b07d3d')}<div><b>Calorias</b><small>${n(c.consumedKcal,0)} / ${n(c.targetKcal,0)} kcal</small></div></div><div class="quick-actions"><button onclick="quickCalories(100)">+100 kcal</button><button onclick="quickCalories(300)">+300 kcal</button></div></div></div><p class="nutrition-note">Use os atalhos para registrar rapidamente. Ajuste suas metas diárias em Configurações.</p></section>`} function quickWater(amount){const x=nutritionDay();upsertNutrition(today(),x.water.amountMl+amount,x.calories.consumedKcal);notice(`+${amount} ml registrados`);layout()} function quickCalories(amount){const x=nutritionDay();upsertNutrition(today(),x.water.amountMl,x.calories.consumedKcal+amount);notice(`+${amount} kcal registradas`);layout()} function sorted(){return [...state.records].sort((a,b)=>a.date.localeCompare(b.date))} function latest(){return sorted().at(-1)} function fmtMetric(r){return ['waist','hip','chest','arm','thigh','fat'].filter(k=>r[k]!=null).map(k=>({waist:'Cintura',hip:'Quadril',chest:'Peito',arm:'Braço',thigh:'Coxa',fat:'Gordura'}[k]+' '+n(r[k])+(k==='fat'?'%':'cm')))} function bmi(w,h){return w&&h?w/((h/100)**2):null}function ageFromBirthDate(b){if(!b)return null;const birth=new Date(b+'T12:00:00');if(Number.isNaN(birth.getTime()))return null;const now=new Date();if(birth>now)return null;let age=now.getFullYear()-birth.getFullYear();const before=now<new Date(now.getFullYear(),birth.getMonth(),birth.getDate());return Math.max(0,age-(before?1:0))}function bmiClass(v,b){if(!v)return 'Informe peso e altura';const age=ageFromBirthDate(b);if(age==null)return 'Informe sua data de nascimento';if(age<18)return 'Percentil pediátrico necessário';if(age>=65){if(v<22)return 'Abaixo da referência 65+';if(v<=27)return 'Dentro da referência 65+';return 'Acima da referência 65+'}if(v<18.5)return 'Abaixo da referência adulta';if(v<25)return 'Faixa adequada adulta';if(v<30)return 'Sobrepeso — referência adulta';if(v<35)return 'Obesidade I — referência adulta';if(v<40)return 'Obesidade II — referência adulta';return 'Obesidade III — referência adulta'}
function metricLabel(metric){return ({weight:'Peso',waist:'Cintura',hip:'Quadril',chest:'Peito',arm:'Braço',thigh:'Coxa',fat:'Gordura corporal'}[metric||'weight']||'Peso')} function metricUnit(metric){return metric==='fat'?'%':metric==='weight'?'kg':'cm'} function valueFor(record,metric){return metric==='weight'?record.weight:record[metric]} function progress(goal){const metric=goal.metric||'weight',now=today(),future=now<goal.startDate,expired=now>goal.endDate,limit=future?goal.startDate:expired?goal.endDate:now;const rs=sorted().filter(r=>valueFor(r,metric)!=null&&r.date>=goal.startDate&&r.date<=limit);const current=rs.at(-1)?valueFor(rs.at(-1),metric):goal.startWeight;const delta=goal.targetWeight-goal.startWeight;const p=Math.max(0,Math.min(100,delta===0?100:((current-goal.startWeight)/delta)*100));const elapsed=Math.max(0,Math.min(1,(new Date(limit+'T12:00:00')-new Date(goal.startDate+'T12:00:00'))/(days(goal.startDate,goal.endDate)*86400000)));const expected=goal.startWeight+delta*elapsed;const remaining=Math.abs(goal.targetWeight-current);const pace=Math.abs(delta)/(days(goal.startDate,goal.endDate)/7);const achieved=remaining<=(metric==='fat'?.2:.2)||p>=100;const onTrack=delta<0?current<=expected+(metric==='fat'?.35:.35):current>=expected-(metric==='fat'?.35:.35);return{metric,current,p,remaining,pace,expected,achieved,onTrack,future,expired,has:rs.length,records:rs}}
function status(x){if(x.achieved)return['Objetivo atingido','positive'];if(x.future)return['Começa em breve','neutral'];if(x.expired)return['Período encerrado',x.onTrack?'positive':'negative'];return[x.onTrack?'No ritmo':'Ajuste o ritmo',x.onTrack?'positive':'negative']}
function ring(p,light=false){const c=2*Math.PI*34;const safe=Math.max(0,Math.min(100,p));return `<div class="ring"><svg viewBox="0 0 84 84"><circle class="ring-bg" cx="42" cy="42" r="34"/><circle class="ring-value" cx="42" cy="42" r="34" stroke-dasharray="${safe/100*c} ${c}"/></svg><div class="ring-label"><b>${Math.round(safe)}%</b><span>da meta</span></div></div>`}
function layout(){const nav=[['inicio','⌂','Visão geral'],['registrar','＋','Registrar'],['historico','◷','Histórico'],['metas','◎','Metas'],['evolucao','⌁','Evolução'],['config','⚙','Configurações']];$('#sideNav').innerHTML=nav.map(x=>`<button class="${state.view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} <span>${x[2]}</span>${x[0]==='historico'&&state.records.length?`<i class="nav-count">${state.records.length}</i>`:''}</button>`).join('');$('#mobileNav').innerHTML=nav.map(x=>`<button class="${state.view===x[0]?'active':''}" onclick="go('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('');$('#userName').textContent=state.settings.name||'seu progresso';$('#avatar').textContent=(state.settings.name||'P').trim().charAt(0).toUpperCase();render()}
function go(v){state.view=v;state.editingRecord=null;state.editingGoal=null;state.showGoalForm=false;scrollTo(0,0);layout()}
function recordRow(r){return `<div class="record"><div class="record-date"><span>${date(r.date)}</span><b>${new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(new Date(r.date+'T12:00:00')).replace('.','')}</b></div><div class="record-main"><b>${r.weight!=null?n(r.weight)+' kg':'Medidas registradas'}</b><div class="record-details">${r.weight!=null&&state.settings.height?`<span>IMC ${n(bmi(r.weight,state.settings.height))}</span>`:''}${fmtMetric(r).slice(0,3).map(x=>`<span>${esc(x)}</span>`).join('')}${r.notes?'<span>Nota adicionada</span>':''}</div></div><button class="icon-btn" onclick="editRecord(${esc(js(r.id))})" aria-label="Editar">✎</button></div>`}
function reminder(){const last=latest(), todayDate=today(), due=!last||last.date<todayDate, dismissed=load(KEYS.reminder,'')===todayDate;if(!due||dismissed)return '';return `<section class="reminder"><span class="reminder-icon">✦</span><div><b>Seu check-in de hoje</b><p>${last?'Faz um registro rápido para manter seu gráfico atualizado.':'Comece com seu primeiro registro e acompanhe sua evolução.'}</p></div><button class="btn primary" onclick="go('registrar')">Registrar peso</button><button class="reminder-close" aria-label="Dispensar lembrete" onclick="dismissReminder()">×</button></section>`}
function dismissReminder(){save(KEYS.reminder,today());registerPWA();scheduleLocalNotifications();layout();notice('Lembrete dispensado por hoje','info')}
function overview(){const rs=sorted(),last=rs.at(-1),prev=rs.at(-2),first=rs.find(r=>r.weight!=null)?.weight,current=last?.weight;const active=state.goals.filter(g=>{const x=progress(g);return !x.expired&&!x.achieved}).sort((a,b)=>a.endDate.localeCompare(b.endDate))[0];return `<div class="stack"><section class="title-row"><div><span class="eyebrow">${new Date().getHours()<12?'Bom dia':new Date().getHours()<18?'Boa tarde':'Boa noite'}</span><h1>Seu ritmo,<br><em>seu resultado.</em></h1><p class="intro">Pequenos registros constroem uma visão real da sua evolução.</p></div><span class="date-chip">${date(today())}</span></section>${reminder()}${active?spotlight(active):''}<section class="hero"><div><span class="kicker">Peso atual</span><div class="hero-number">${n(current)} <small>kg</small></div><div class="hero-sub">${last?'Atualizado em '+date(last.date,true):'Ainda não há registros'}</div></div><div class="hero-goal">${active?ring(progress(active).p):ring(0)}<div class="hero-goal-copy"><span>${active?'Meta em andamento':'Meta de peso'}</span><b>${active?n(active.targetWeight)+' kg':'Crie uma meta'}</b></div></div></section><div class="stats"><div class="stat sand is-action" role="button" tabindex="0" onclick="go('historico')" onkeydown="if(event.key==='Enter'||event.key===' ')go('historico')"><label>Variação total</label><strong>${first!=null&&current!=null?n(current-first):'—'}<small> kg</small></strong><p>${first!=null?'desde o primeiro registro':'registre seu peso'}</p></div><div class="stat blue is-action" role="button" tabindex="0" onclick="go('registrar')" onkeydown="if(event.key==='Enter'||event.key===' ')go('registrar')"><label>IMC estimado</label><strong>${n(bmi(current,state.settings.height))}</strong><p>${state.settings.height?'com sua altura':'configure sua altura'}</p></div><div class="stat green is-action" role="button" tabindex="0" onclick="go('metas')" onkeydown="if(event.key==='Enter'||event.key===' ')go('metas')"><label>Metas ativas</label><strong>${state.goals.filter(g=>!progress(g).expired&&!progress(g).achieved).length}</strong><p>${state.goals.length?'acompanhando prazos':'crie sua primeira'}</p></div></div>${nutritionPanel()}${homeWeightChart()}<button class="shortcut" onclick="go('registrar')"><span class="shortcut-icon">＋</span><span><b>Registrar hoje</b><small>Atualize suas medidas em menos de 1 minuto</small></span><b>›</b></button><div class="section-head"><div><span class="kicker">Linha do tempo</span><h2>Registros recentes</h2></div>${state.records.length>3?'<button class="text-btn" onclick="go(\'historico\')">Ver histórico ›</button>':''}</div><section class="card">${rs.length?rs.slice(-3).reverse().map(recordRow).join(''):`<div class="empty"><div class="empty-icon">⌁</div><b>Seu primeiro passo começa aqui</b><p>Registre peso ou uma medida para ver o painel ganhar vida.</p><button class="btn primary" onclick="go('registrar')">＋ Fazer primeiro registro</button></div>`}</section></div>`}
function homeWeightChart(){const all=sorted().filter(r=>r.weight!=null),period=state.chartPeriod||'all',cutoff=period==='all'?null:new Date(Date.now()-Number(period)*86400000),points=all.filter(r=>!cutoff||new Date(r.date+'T23:59:59')>=cutoff),goal=state.settings.goalWeight??state.goals.find(g=>g.metric==='weight'&&!progress(g).expired)?.targetWeight,first=all[0]?.weight,last=all.at(-1)?.weight,tracked=all.length>1?Math.max(1,Math.round((new Date(all.at(-1).date+'T12:00:00')-new Date(all[0].date+'T12:00:00'))/86400000)):0,lost=first!=null&&last!=null?first-last:null,weekly=lost!=null&&tracked?lost/(tracked/7):null,title=all.length?n(last)+' kg':'Registre seu primeiro peso',caption=goal!=null?'Compare seus registros com a meta de '+n(goal)+' kg':'Acompanhe seus registros ao longo do tempo',chart=points.length>=2?'<div class="chart-wrap"><canvas id="homeWeightChart" aria-label="Gráfico do histórico de peso"></canvas></div>':'<div class="empty compact-empty"><p>'+(all.length<2?'Adicione pelo menos dois registros de peso para visualizar o histórico.':'Não há dois registros dentro deste período.')+'</p></div>',bmiValue=bmi(last,state.settings.height),summary=all.length?'<div class="chart-summary"><div><span>Peso total perdido</span><strong>'+n(lost)+' kg</strong></div><div><span>Média semanal</span><strong>'+n(weekly)+' kg/sem.</strong></div><div><span>IMC atual</span><strong>'+n(bmiValue)+'</strong><small>'+bmiClass(bmiValue,state.settings.birthDate)+'</small>'+(bmiValue?'':'<button class="text-btn" onclick="go(\'config\')">Informar altura ›</button>')+'</div></div><p class="chart-disclaimer">Referência informativa; não substitui avaliação profissional. Para menores de 18 anos, o IMC deve ser interpretado por percentis.</p>':'';return '<section class="card chart-card home-weight-card"><div class="section-head"><div><span class="kicker">Histórico de peso</span><h2>'+title+'</h2><small class="chart-caption">'+caption+'</small></div><div class="chart-actions">'+(all.length?'<button class="btn secondary" onclick="exportWeightCsv()">⇩ Exportar CSV</button>':'')+'<select class="chart-period" aria-label="Período do gráfico" onchange="state.chartPeriod=this.value;layout()"><option value="7" '+(period==='7'?'selected':'')+'>Últimos 7 dias</option><option value="30" '+(period==='30'?'selected':'')+'>Últimos 30 dias</option><option value="all" '+(period==='all'?'selected':'')+'>Todo o período</option></select></div></div>'+chart+summary+'</section>'}function spotlight(g){const x=progress(g);return `<section class="goal-spotlight"><div><span class="kicker">Meta em andamento</span><h2>${esc(g.title)}</h2><p>${x.achieved?'Objetivo atingido!':`Faltam ${n(x.remaining)} kg para sua meta.`}</p><button class="text-btn" onclick="go('metas')">Ver detalhes ›</button></div>${ring(x.p,true)}</section>`}
function recordDraft(){try{const x=JSON.parse(localStorage.getItem(KEYS.recordDraft)||'null');return x&&typeof x==='object'?x:{}}catch{return {}}} function setDraftStatus(message='Rascunho salvo automaticamente'){const el=$('#record-draft-status');if(el)el.textContent=message} function saveRecordDraft(){const ids=['r-date','r-height','r-weight','r-fat','r-water','r-calories','r-waist','r-hip','r-chest','r-arm','r-thigh','r-notes'];const draft=Object.fromEntries(ids.map(i=>[i,$('#'+i)?.value??'']));try{localStorage.setItem(KEYS.recordDraft,JSON.stringify(draft));setDraftStatus()}catch{setDraftStatus('Rascunho não pôde ser salvo')}} function restoreRecordDraft(){const draft=recordDraft();Object.entries(draft).forEach(([i,v])=>{const el=$('#'+i);if(el&&v!==undefined)el.value=String(v)});if(Object.keys(draft).length)setDraftStatus()} function clearRecordDraft(){localStorage.removeItem(KEYS.recordDraft);['r-date','r-height','r-weight','r-fat','r-water','r-calories','r-waist','r-hip','r-chest','r-arm','r-thigh','r-notes'].forEach(i=>{const el=$('#'+i);if(el)el.value=i==='r-date'?today():''});setDraftStatus('Formulário limpo — pronto para recomeçar')} function recordForm(){const r=state.editingRecord||{};return `<div class="stack"><section class="title-row"><div><span class="eyebrow">${state.editingRecord?'Editar registro':'Novo registro'}</span><h1>${state.editingRecord?'Ajustar medidas.':'Como você está hoje?'}</h1><p class="intro">Registre apenas o que fizer sentido. Consistência importa mais que perfeição.</p></div></section><form class="card form-card" onsubmit="submitRecord(event)"><div class="form-grid"><label class="field"><span>Data</span><input id="r-date" type="date" value="${esc(r.date||today())}" required></label><label class="field"><span>Altura <small>cm</small></span><input id="r-height" type="number" min="50" max="260" step=".1" value="${esc(state.settings.height||'')}" placeholder="ex.: 175"></label><label class="field"><span>Peso <b>*</b><small>kg</small function submitRecord(e){e.preventDefault();const r={id:state.editingRecord?.id||id(),date:$('#r-date').value,weight:num($('#r-weight').value),fat:num($('#r-fat').value),waist:num($('#r-waist').value),hip:num($('#r-hip').value),chest:num($('#r-chest').value),arm:num($('#r-arm').value),thigh:num($('#r-thigh').value),notes:$('#r-notes').value.trim().slice(0,500)};if(!r.date||r.weight==null&&r.fat==null&&r.waist==null&&r.hip==null&&r.chest==null&&r.arm==null&&r.thigh==null){$('#r-error').innerHTML='<p class="error">Informe a data e pelo menos uma medida.</p>';return}state.records=state.records.filter(x=>x.date!==r.date&&x.id!==r.id);state.records.push(r);const h=num($('#r-height').value);if(h)state.settings.height=h;upsertNutrition(r.date,num($('#r-water').value),num($('#r-calories').value));save(KEYS.records,state.records);save(KEYS.settings,state.settings);localStorage.removeItem(KEYS.recordDraft);notice('Registro salvo');go('inicio')}
function goalCard(g){const x=progress(g),st=status(x),unit=metricUnit(x.metric);return `<article class="card goal-card"><div class="goal-head"><div><span class="kicker">${esc(g.title)} · ${metricLabel(x.metric)}</span><p class="goal-period">${date(g.startDate,true)} — ${date(g.endDate,true)}</p></div><span class="goal-status ${st[1]}">${st[0]}</span></div><div class="goal-body">${ring(x.p)}<div class="goal-number"><span>Valor atual</span><strong>${n(x.current)} <small>${unit}</small></strong><p>Meta: <b>${n(g.targetWeight)} ${unit}</b></p></div><div class="goal-distance"><span>${x.achieved?'Você chegou lá':'Faltam'}</span><strong>${x.achieved?'0,0':n(x.remaining)} <small>${unit}</small></strong><p>${x.has?'Ritmo alvo '+n(x.pace)+' '+unit+'/sem.':'Registre '+metricLabel(x.metric).toLowerCase()+' para atualizar'}</p></div></div><div class="goal-line"><span style="width:${x.p}%"></span></div><div class="goal-foot"><span>${x.has?'Último valor: '+n(x.current)+' '+unit:'Sem registro no período'}</span><div class="goal-actions"><button onclick="editGoal(${esc(js(g.id))})">✎ Editar</button><button class="remove" onclick="removeGoal(${esc(js(g.id))})">Excluir</button></div></div></article>`}
function updateGoalMetricFields(){const metric=$('#g-metric')?.value||'weight',label=metricLabel(metric),unit=metricUnit(metric);document.querySelectorAll('.goal-value-label').forEach((el,i)=>{el.innerHTML=(i?'Valor desejado ':'Valor inicial ')+`<small>${unit}</small>`});document.querySelectorAll('.goal-value-input').forEach(el=>{el.placeholder=metric==='fat'?'ex.: 25':'ex.: '+(unit==='kg'?'82,4':'95')})} function goalForm(){const g=state.editingGoal||{};const selectedMetric=g.metric||'weight';const metricStart=valueFor(latest()||{},selectedMetric);return `<form class="card goal-form" onsubmit="submitGoal(event)"><div class="goal-form-head"><div><span class="kicker">${state.editingGoal?'Editar meta':'Nova meta'}</span><h2>Transforme intenção em um período.</h2><p>Defina de onde você parte, onde quer chegar e até quando.</p></div><button type="button" class="icon-btn" onclick="cancelGoal()">×</button></div><div class="form-grid"><label class="field full"><span>Nome da meta</span><input id="g-title" maxlength="100" value="${esc(g.title||'Meta de emagrecimento')}" placeholder="Ex.: Projeto verão"></label><label class="field"><span>O que acompanhar?</span><select id="g-metric" onchange="updateGoalMetricFields()"><option value="weight" ${selectedMetric==='weight'?'selected':''}>Peso (kg)</option><option value="waist" ${selectedMetric==='waist'?'selected':''}>Cintura (cm)</option><option value="hip" ${selectedMetric==='hip'?'selected':''}>Quadril (cm)</option><option value="chest" ${selectedMetric==='chest'?'selected':''}>Peito (cm)</option><option value="arm" ${selectedMetric==='arm'?'selected':''}>Braço (cm)</option><option value="thigh" ${selectedMetric==='thigh'?'selected':''}>Coxa (cm)</option><option value="fat" ${selectedMetric==='fat'?'selected':''}>Gordura corporal (%)</option></select></label><label class="field"><span>Começa em</span><input id="g-start" type="date" value="${esc(g.startDate||today())}" required></label><label class="field"><span>Termina em</span function goalsPage(){const active=state.goals.filter(g=>{const x=progress(g);return !x.expired&&!x.achieved}).sort((a,b)=>a.endDate.localeCompare(b.endDate));const old=state.goals.filter(g=>!active.some(x=>x.id===g.id));return `<div class="stack"><section class="title-row"><div><span class="eyebrow">Direção e consistência</span><h1>Metas que cabem<br><em>no seu tempo.</em></h1><p class="intro">Acompanhe o quanto falta, o ritmo necessário e se você está no caminho certo.</p></div><button class="btn primary" onclick="newGoal()">＋ Nova meta</button></section>${state.showGoalForm?goalForm():''}<section><div class="section-head"><div><span class="kicker">Em andamento</span><h2>${active.length?'Seu próximo marco':'Comece com uma meta'}</h2></div></div><div class="goals" style="margin-top:13px">${active.length?active.map(goalCard).join(''):`<section class="card"><div class="empty"><div class="empty-icon">◎</div><b>Uma meta torna o progresso mais concreto</b><p>Escolha um período realista e acompanhe sua evolução semanal.</p><button class="btn primary" onclick="newGoal()">◎ Criar primeira meta</button></div></section>`}</div></section>${old.length?`<section><div class="section-head"><div><span class="kicker">Histórico de metas</span><h2>O que você já construiu</h2></div></div><div class="goals" style="margin-top:13px">${old.map(goalCard).join('')}</div></section>`:''}<button class="shortcut" onclick="go('registrar')"><span class="shortcut-icon">＋</span><span><b>Registrar peso</b><small>O indicador fica mais preciso a cada registro</small></span><b>›</b></button></div>`}
function submitGoal(e){e.preventDefault();const g={id:state.editingGoal?.id||id(),metric:$('#g-metric').value,title:$('#g-title').value.trim(),startDate:$('#g-start').value,endDate:$('#g-end').value,startWeight:num($('#g-start-w').value),targetWeight:num($('#g-target-w').value),notes:$('#g-notes').value.trim().slice(0,500)};if(!g.title||!g.startDate||!g.endDate||!g.startWeight||!g.targetWeight){$('#g-error').innerHTML='<p class="error">Preencha título, período e os dois pesos.</p>';return}if(g.endDate<=g.startDate){$('#g-error').innerHTML='<p class="error">A data final precisa ser depois da inicial.</p>';return}state.goals=state.goals.filter(x=>x.id!==g.id);state.goals.push(g);save(KEYS.goals,state.goals);notice('Meta salva');cancelGoal()}

function hydrationWeekData(){const end=new Date(today()+'T12:00:00'),items=[];for(let offset=6;offset>=0;offset--){const d=new Date(end);d.setDate(end.getDate()-offset);const key=d.toISOString().slice(0,10),row=state.water.find(x=>x.date===key)||{},target=row.targetMl||state.settings.waterTargetMl||2000;items.push({date:key,label:new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(d).replace('.',''),amount:Number(row.amountMl)||0,target})}return{labels:items.map(x=>x.label),values:items.map(x=>x.amount),target:items.map(x=>x.target),items}} function weekStart(value){const d=new Date(value+'T12:00:00'),day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d.toISOString().slice(0,10)} function weekLabel(value){const d=new Date(value+'T12:00:00');return 'Sem. '+new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit'}).format(d)} function weeklyChartData(metric){const groups=new Map();sorted().filter(r=>r[metric]!=null).forEach(r=>{const key=weekStart(r.date);groups.set(key,r)});const records=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([,r])=>r);return{labels:records.map(r=>weekLabel(weekStart(r.date))),values:records.map(r=>r[metric]),records}} function destroyCharts(){Object.values(charts).forEach(chart=>{try{chart.destroy()}catch{}});charts={}} function drawCharts(metric='waist'){if(typeof Chart==='undefined')return;destroyCharts();const weight=weeklyChartData('weight');const measure=weeklyChartData(metric);const hydration=hydrationWeekData();const activeGoal=state.goals.find(g=>(g.metric||'weight')==='weight'&&!progress(g).expired&&!progress(g).achieved);const expected=activeGoal?weight.records.map(r=>{const elapsed=Math.max(0,Math.min(1,(new Date(r.date+'T12:00:00')-new Date(activeGoal.startDate+'T12:00:00'))/(days(activeGoal.startDate,activeGoal.endDate)*86400000)));return activeGoal.startWeight+(activeGoal.targetWeight-activeGoal.startWeight)*elapsed}):[];const base={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,position:'bottom',labels:{usePointStyle:true,padding:16,font:{size:12}}},tooltip:{padding:12,callbacks:{label:ctx=>`${ctx.dataset.label}: ${n(ctx.parsed.y)} ${metric==='weight'?'kg':'cm'}`}}},scales:{x:{grid:{display:false},ticks:{color:'#68766e',font:{size:12,weight:'600'},maxRotation:0,autoSkip:true,maxTicksLimit:8}},y:{grid:{color:'#e7eeea'},ticks:{color:'#68766e',font:{size:12,weight:'600'},padding:8}}}};const weightCanvas=document.getElementById('weightChart');if(weightCanvas&&weight.records.length){charts.weight=new Chart(weightCanvas,{type:'line',data:{labels:weight.labels,datasets:[{label:'Peso semanal',data:weight.values,borderColor:'#236954',backgroundColor:'#23695418',pointBackgroundColor:'#236954',pointBorderColor:'#fff',pointBorderWidth:3,pointRadius:5,tension:.35,fill:true},{label:'Meta esperada',data:expected,borderColor:'#b07d3d',pointRadius:0,borderDash:[7,5],borderWidth:2,tension:.25,fill:false}]},options:base})}const metricCanvas=document.getElementById('measureChart');if(metricCanvas&&measure.records.length){charts.measure=new Chart(metricCanvas,{type:'line',data:{labels:measure.labels,datasets:[{label:`${metricLabel(metric)} semanal`,data:measure.values,borderColor:'#846945',backgroundColor:'#84694518',pointBackgroundColor:'#846945',pointBorderColor:'#fff',pointBorderWidth:3,pointRadius:5,tension:.35,fill:true}]},options:base})}const bmiCanvas=document.getElementById('bmiChart');if(bmiCanvas&&state.settings.height&&weight.records.length){const bmiValues=weight.records.map(r=>bmi(r.weight,state.settings.height));charts.bmi=new Chart(bmiCanvas,{type:'line',data:{labels:weight.labels,datasets:[{label:'IMC semanal',data:bmiValues,borderColor:'#3a8ab0',backgroundColor:'#3a8ab018',pointBackgroundColor:'#3a8ab0',pointBorderColor:'#fff',pointBorderWidth:3,pointRadius:5,tension:.35,fill:true}]},options:{...base,plugins:{...base.plugins,tooltip:{padding:12,callbacks:{label:ctx=>`${ctx.dataset.label}: ${n function evolution(){const rs=sorted().filter(r=>r.weight!=null),weekly=weeklyChartData('weight'),metrics=[['waist','Cintura'],['hip','Quadril'],['chest','Peito'],['arm','Braço'],['thigh','Coxa']];const variation=weekly.values.length>1?weekly.values.at(-1)-weekly.values[0]:null;return `<div class="stack"><section class="title-row"><div><span class="eyebrow">Leitura semanal</span><h1>Veja sua evolução.</h1><p class="intro">Uma visão mais tranquila: cada ponto representa o último registro da semana.</p></div></section><section class="weekly-summary"><div><span>Semanas acompanhadas</span><b>${weekly.records.length}</b></div><div><span>Variação semanal acumulada</span><b class="${variation!=null&&variation<0?'good':''}">${variation!=null?n(variation)+' kg':'—'}</b></div><div><span>Última semana</span><b>${weekly.records.at(-1)?n(weekly.records.at(-1).weight)+' kg':'—'}</b></div></section><section class="card chart-card"><div class="section-head"><div><span class="kicker">Resumo semanal</span><h2>${rs.length?n(rs.at(-1).weight)+' kg':'Registre seu primeiro peso'}</h2><small class="chart-caption">Peso registrado por semana + linha de meta esperada</small></div><span class="pill">${weekly.records.length} ${weekly.records.length===1?'semana':'semanas'}</span></div>${rs.length?'<div class="chart-wrap weekly-chart"><canvas id="weightChart" aria-label="Gráfico semanal de evolução do peso"></canvas></div>':'<div class="empty"><div class="empty-icon">⌁</div><b>Seu gráfico começa com o primeiro registro</b><p>Adicione pesos em semanas diferentes para visualizar sua tendência.</p><button class="btn primary" onclick="go(\'registrar\')">＋ Registrar agora</button></div>'}</section><section class="card chart-card"><div class="section-head"><div><span class="kicker">Composição calculada</span><h2>IMC por período</h2><small class="chart-caption">Estimativa usando peso, altura e data de nascimento configurados</small></div></div>${state.settings.height&&weeklyChartData('weight').records.some(r=>bmi(r.weight,state.settings.height)!=null)?'<div class="chart-wrap weekly-chart"><canvas id="bmiChart" aria-label="Gráfico semanal de evolução do IMC"></canvas></div>':'<div class="empty compact"><div class="empty-icon">◌</div><b>Configure sua altura para acompanhar o IMC</b><p>Depois, registre pelo menos dois pesos em períodos diferentes.</p><button class="btn secondary" onclick="go(\'config\')">⚙ Configurar altura</button></div>'}</section><section class="card chart-card"><div class="section-head"><div><span class="kicker">Acompanhamento de metas</span><h2>Progresso por período</h2><small class="chart-caption">Percentual estimado a partir de cada registro e da meta correspondente</small></div></div>${state.goals.length&&state.records.length?'<div class="chart-wrap weekly-chart"><canvas id="goalChart" aria-label="Gráfico semanal do progresso das metas"></canvas></div>':'<div class="empty compact"><div class="empty-icon">◎</div><b>Crie uma meta para acompanhar o progresso</b><p>O gráfico aparecerá conforme você registrar novas medidas.</p><button class="btn secondary" onclick="go(\'metas\')">＋ Criar meta</button></div>'}</section><section class="card chart-card"><div class="section-head"><div><span class="kicker">Progresso físico semanal</span><h2>Medidas corporais</h2><small class="chart-caption">Última medida registrada em cada semana</small></div></div><div class="metric-tabs"><h2>Medidas corporais</h2><small class="chart-caption">Última medida registrada em cada semana</small></div></div><div class="metric-tabs">${metrics.map(([key,label],i)=>`<button data-metric="${key}" class="${i===0?'active':''}" onclick="selectMetric('${key}')">${label}</button>`).join('')}</div>${state.records.some(r=>r.waist!=null||r.hip!=null||r.chest!=null||r.arm!=null||r.thigh!=null)?'<div class="chart-wrap weekly-chart"><canvas id="measureChart" aria-label="Gráfico semanal de evolução das medidas"></canvas></div>':'<div class="empty compact"><div class="empty-icon">◎</div><b>Adicione medidas para acompanhar mudanças além da balança</b><p>Cintura, quadril, peito, braço e coxa ficam disponíveis aqui.</p><button class="btn secondary" onclick="go(\'registrar\')">＋ Registrar medidas</button></div>'}</section><section class="card chart-card hydration-history-card"><div class="section-head"><div><span class="kicker">Hidratação</span><h2>Últimos 7 dias</h2><small class="chart-caption">Água registrada por dia comparada com sua meta</small></div><span class="pill">${state.water.length?'histórico salvo':'sem registros'}</span></div>${state.water.length?'<div class="chart-wrap weekly-chart"><canvas id="hydrationChart" aria-label="Gráfico dos últimos sete dias de hidratação"></canvas></div>':'<div class="empty compact"><div class="empty-icon">◌</div><b>Seu histórico de hidratação aparecerá aqui</b><p>Use os atalhos de água na tela inicial para começar a registrar.</p><button class="btn secondary" onclick="go(\'inicio\')">＋ Registrar água</button></div>'}</section><section class="card chart-note"><b>Como ler seus gráficos</b><p>Oscilações de um dia para o outro são normais. Observe a direção ao longo de várias semanas e combine a leitura com suas medidas e bem-estar.</p></section></div>`}
function settings(){return `<div class="stack"><section class="title-row"><div><span class="eyebrow">Seu espaço</span><h1>Configurações.</h1><p class="intro">Ajuste seu perfil e mantenha um backup do aparelho.</p></div></section><section class="card settings-card"><div class="section-head"><div><span class="kicker">Perfil</span><h2>Como acompanhar?</h2></div></div><div class="form-grid"><label class="field full"><span>Como quer ser chamado?</span><input id="s-name" maxlength="40" value="${esc(state.settings.name||'')}" placeholder="Seu nome"></label><label class="field"><span>Data de nascimento <small>para faixas etárias</small></span><input id="s-birth-date" type="date" max="${today()}" value="${esc(state.settings.birthDate||'')}"></label><label class="field"><span>Altura <small>cm</small></span><input id="s-height" type="number" min="50" max="260" step=".1" value="${esc(state.settings.height||'')}" placeholder="ex.: 175"></label><label class="field"><span>Meta diária de água <small>ml</small></span><input id="s-water-target" type="number" min="250" max="10000" step="50" value="${state.settings.waterTargetMl||2000}" placeholder="ex.: 2000"></label><label class="field"><span>Meta diária de calorias <small>kcal</small></span><input id="s-calorie-target" type="number" min="500" max="20000" step="50" value="${state.settings.calorieTargetKcal||2000}" placeholder="ex.: 2000"></label><label class="field"><span>Horário do lembrete <small>local</small></span><input id="s-notify-time" type="time" value="${esc(state.settings.notificationTime||'20:00')}"></label></div><div class="form-foot"><span>▣ Dados salvos neste aparelho</span><button class="btn primary" onclick="saveSettings()">✓ Salvar preferências</button></div></section><section class="card settings-card"><div class="section-head"><div><span class="kicker">Backup</span><h2>Leve seus dados com você.</h2></div></div><p class="intro" style="margin-top:8px">Exporte um JSON antes de trocar de celular ou limpar o navegador.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px"><button class="btn secondary" onclick="exportData()">↓ Exportar JSON</button><button class="btn secondary" onclick="$('#import-merge').click()">＋ Mesclar JSON</button><button class="btn secondary" onclick="$('#import-replace').click()">↑ Substituir dados</button><input id="import-merge" class="hide" type="file" accept="application/json,.json" onchange="importData(event,'merge')"><input id="import-replace" class="hide" type="file" accept="application/json,.json" onchange="importData(event,'replace')"></div><p style="margin-top:16px;color:var(--faint);font-size:11px">${state.records.length} registros · ${state.goals.length} metas neste aparelho</p>${state.mergeUndo?`<button class="btn secondary undo-merge" onclick="undoLastMerge()">↶ Desfazer última mesclagem</button>`:``}</section><section class="card settings-card"><div class="section-head"><div><span class="kicker">PWA e lembretes</span><h2>Não perca o ritmo.</h2></div></div><p class="intro" style="margin-top:8px">Receba um lembrete local para registrar água e calorias. No GitHub Pages, o aviso é disparado quando o aplicativo/PWA estiver aberto ou voltar para a tela; o navegador não oferece um alarme diário confiável com o app totalmente encerrado.</p><button class="btn secondary" style="margin-top:16px" onclick="toggleNotifications()">${state.settings.notificationEnabled?'✓ Notificações ativadas — desativar':'✦ Ativar notificações locais'}</button></section><section class="card settings-card" style="border-color:#f1dede;background:#fffafa"><div class="section-head"><div><span class="kicker" style="color:#a74848">Zona de cuidado</span><h2>Apagar dados locais</h2></div></div><p style="margin-top:6px;color:#aa7878;font-size:11px">Remove registros, metas e preferências deste navegador.</p><button class="btn danger" style="margin-top:16px" onclick="clearAll()">Apagar tudo</button></section></div>`}
function saveSettings(){state.settings.name=$('#s-name').value.trim();state.settings.birthDate=$('#s-birth-date').value||'';state.settings.height=num($('#s-height').value);state.settings.waterTargetMl=num($('#s-water-target').value)||2000;state.settings.calorieTargetKcal=num($('#s-calorie-target').value)||2000;state.settings.notificationTime=$('#s-notify-time').value||'20:00';save(KEYS.settings,state.settings);scheduleLocalNotifications();notice('Preferências salvas');layout()}function exportData(){const blob=new Blob([JSON.stringify({version:5,exportedAt:new Date().toISOString(),settings:state.settings,records:state.records,goals:state.goals,water:state.water,calories:state.calories},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='progresso-fisico-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);notice('Backup exportado')}function mergeList(current,incoming,key){const map=new Map(current.map(item=>[key(item),item]));incoming.forEach(item=>{const k=key(item);if(!map.has(k))map.set(k,item);else map.set(k,{...item,...map.get(k)})});return [...map.values()]} function cloneData(){return JSON.parse(JSON.stringify({records:state.records,goals:state.goals,water:state.water,calories:state.calories,settings:state.settings}))} function mergeSummary(current,incoming,key){const existing=new Set(current.map(key));return{total:incoming.length,added:incoming.filter(x=>!existing.has(key(x))).length,conflicts:incoming.filter(x=>existing.has(key(x))).length}} function buildMergePlan(x){const list=v=>Array.isArray(v)?v:[];const records=list(x.records),goals=list(x.goals),water=list(x.water),calories=list(x.calories);return{payload:x,records:mergeSummary(state.records,records,item=>item.date||item.id),goals:mergeSummary(state.goals,goals,item=>item.id||[item.metric,item.startDate,item.endDate,item.title].join('|')),water:mergeSummary(state.water,water,item=>item.date),calories:mergeSummary(state.calories,calories,item=>item.date)}} function mergePreview(plan){const rows=[['Registros corporais',plan.records],['Metas',plan.goals],['Água',plan.water],['Calorias',plan.calories]];return `<div class="modal-backdrop" id="merge-preview"><section class="merge-modal" role="dialog" aria-modal="true" aria-labelledby="merge-title"><span class="kicker">Revisão do backup</span><h2 id="merge-title">Confirmar mesclagem?</h2><p class="merge-intro">Os dados atuais permanecerão. Em conflitos, o valor salvo neste aparelho terá prioridade.</p><div class="merge-summary">${rows.map(([label,x])=>`<div class="merge-row"><span>${label}</span><b>${x.added} novos</b><small>${x.conflicts} conflitos · ${x.total} no backup</small></div>`).join('')}</div><div class="merge-actions"><button class="btn secondary" onclick="cancelMerge()">Cancelar</button><button class="btn primary" onclick="confirmMerge()">✓ Confirmar mesclagem</button></div></section></div>`} function showMergePreview(payload){state.pendingMerge=buildMergePlan(payload);document.querySelector('#merge-preview')?.remove();document.body.insertAdjacentHTML('beforeend',mergePreview(state.pendingMerge))} function cancelMerge(){state.pendingMerge=null;document.querySelector('#merge-preview')?.remove();notice('Mesclagem cancelada','info')} function applyMerge(x){state.mergeUndo={createdAt:new Date().toISOString(),data:cloneData()};save(KEYS.mergeUndo,state.mergeUndo);const list=v=>Array.isArray(v)?v:[];state.records=mergeList(state.records,list(x.records),item=>item.date||item.id);state.goals=mergeList(state.goals,list(x.goals),item=>item.id||[item.metric,item.startDate,item.endDate,item.title].join('|'));state.water=mergeList(state.water,list(x.water),item=>item.date);state.calories=mergeList(state.calories,list(x.calories),item=>item.date);state.settings={...(x.settings&&typeof x.settings==='object'?x.settings:{}),...state.settings};save(KEYS.records,state.records);save(KEYS.goals,state.goals);save(KEYS.water,state.water);save(KEYS.calories,state.calories);save(KEYS.settings,state.settings);state.pendingMerge=null;document.querySelector('#merge-preview')?.remove();layout();notice('Backup mesclado sem sobrescrever dados atuais')} function confirmMerge(){if(state.pendingMerge)applyMerge(state.pendingMerge.payload)} function undoLastMerge(){if(!state.mergeUndo)return;if(!confirm('Desfazer a última mesclagem e restaurar os dados anteriores?'))return;const d=state.mergeUndo.data;state.records=d.records||[];state.goals=d.goals||[];state.water=d.water||[];state.calories=d.calories||[];state.settings=d.settings||{};save(KEYS.records,state.records);save(KEYS.goals,state.goals);save(KEYS.water,state.water);save(KEYS.calories,state.calories);save(KEYS.settings,state.settings);state.mergeUndo=null;localStorage.removeItem(KEYS.mergeUndo);layout();notice('Última mesclagem desfeita')} function importData(e,mode='replace'){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=='object'||Array.isArray(x))throw new Error('Formato inválido');if(mode==='merge'){showMergePreview(x);return}if(!confirm('Substituir os dados atuais pelo backup? Exporte um backup antes se quiser manter uma cópia.')){e.target.value='';return}const list=v=>Array.isArray(v)?v:[];state.records=list(x.records);state.goals=list(x.goals);state.water=list(x.water);state.calories=list(x.calories);if(x.settings&&typeof x.settings==='object')state.settings=x.settings;save(KEYS.records,state.records);save(KEYS.goals,state.goals);save(KEYS.water,state.water);save(KEYS.calories,state.calories);save(KEYS.settings,state.settings);layout();notice('Backup importado e aplicado')}catch{notice('Não foi possível ler o backup','error')}};r.readAsText(f);e.target.value=''}function clearAll(){if(!confirm('Apagar todos os dados deste aparelho?'))return;state.records=[];state.goals=[];state.water=[];state.calories=[];state.settings={};Object.values(KEYS).forEach(k=>localStorage.removeItem(k));notice('Dados apagados','info');layout()}
async function showLocalNotification(force=false){if(!state.settings.notificationEnabled||!('Notification' in window)||Notification.permission!=='granted')return false;const now=new Date(),currentTime=now.toTimeString().slice(0,5),target=state.settings.notificationTime||'20:00',day=today();if(!force&&(currentTime<target||state.settings.notificationLastShown===day))return false;const registration=await navigator.serviceWorker?.ready;if(!registration?.showNotification)return false;const x=nutritionDay();const waterDone=x.water.targetMl&&x.water.amountMl>=x.water.targetMl;const caloriesDone=x.calories.targetKcal&&x.calories.consumedKcal>=x.calories.targetKcal;const pending=waterDone&&caloriesDone?'Suas metas de hoje estão completas. Continue no ritmo!':`Água: ${n(x.water.amountMl,0)} / ${n(x.water.targetMl,0)} ml · Calorias: ${n(x.calories.consumedKcal,0)} / ${n(x.calories.targetKcal,0)} kcal`;await registration.showNotification('Progresso — check-in diário',{body:pending,icon:'./icons/icon.svg',badge:'./icons/icon.svg',tag:'progresso-daily-checkin',renotify:false,data:{url:'./'}});state.settings.notificationLastShown=day;save(KEYS.settings,state.settings);return true} async function enableNotifications(){if(!('Notification' in window)){notice('Este navegador não oferece notificações','error');return}const permission=await Notification.requestPermission();if(permission!=='granted'){notice('Permissão de notificações não concedida','info');return}state.settings.notificationEnabled=true;save(KEYS.settings,state.settings);const shown=await showLocalNotification(true);scheduleLocalNotifications();notice(shown?'Notificações ativadas — aviso de teste exibido':'Notificações ativadas')} function toggleNotifications(){if(state.settings.notificationEnabled){state.settings.notificationEnabled=false;save(KEYS.settings,state.settings);notice('Notificações desativadas','info');layout();return}enableNotifications()} function scheduleLocalNotifications(){clearInterval(window.__notificationTimer);if(!state.settings.notificationEnabled)return;showLocalNotification();window.__notificationTimer=setInterval(()=>showLocalNotification(),60000)} document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.view==='registrar')saveRecordDraft();if(!document.hidden)showLocalNotification()});window.addEventListener('pagehide',()=>{if(state.view==='registrar')saveRecordDraft()});document.addEventListener('input',event=>{if(state.view==='registrar'&&event.target.closest('form'))saveRecordDraft()});function registerPWA(){if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./service-worker.js').then(()=>scheduleLocalNotifications()).catch(()=>{})} function exportWeightCsv(){const rows=sorted().filter(r=>r.weight!=null||r.waist!=null||r.hip!=null||r.chest!=null||r.arm!=null||r.thigh!=null||r.fat!=null);if(!rows.length){notice('Registre pelo menos uma medida antes de exportar','info');return}const cell=v=>{const x=v==null?'':String(v).replace('.',',');return /[",\r\n]/.test(x)?`"${x.replace(/"/g,'""')}"`:x};const csv=['data,peso_kg,cintura_cm,quadril_cm,peito_cm,braco_cm,coxa_cm,gordura_pct,observacoes',...rows.map(r=>[r.date,r.weight,r.waist,r.hip,r.chest,r.arm,r.thigh,r.fat,r.notes].map(cell).join(','))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`historico-corporal-${today()}.csv`;link.click();URL.revokeObjectURL(url);notice('Histórico corporal exportado')}function drawHomeWeightChart(){const canvas=document.getElementById('homeWeightChart');if(!canvas)return;const period=state.chartPeriod||'all',cutoff=period==='all'?null:new Date(Date.now()-Number(period)*86400000),points=sorted().filter(r=>r.weight!=null).filter(r=>!cutoff||new Date(r.date+'T23:59:59')>=cutoff),goal=state.settings.goalWeight??state.goals.find(g=>g.metric==='weight'&&!progress(g).expired)?.targetWeight;if(points.length<2)return;const datasets=[{label:'Peso registrado',data:points.map(r=>r.weight),borderColor:'#236954',backgroundColor:'#23695418',pointBackgroundColor:'#236954',pointBorderColor:'#fff',pointBorderWidth:3,pointRadius:5,tension:.35,fill:true}];if(goal!=null)datasets.push({label:`Meta: ${n(goal)} kg`,data:points.map((r,i)=>points[0].weight+(goal-points[0].weight)*(i/Math.max(points.length-1,1))),borderColor:'#b07d3d',pointRadius:0,borderDash:[7,5],borderWidth:2,tension:.25,fill:false});charts.homeWeight=new Chart(canvas,{type:'line',data:{labels:points.map(r=>r.date),datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,position:'bottom',labels:{usePointStyle:true,padding:14,font:{size:11}}},tooltip:{padding:12,callbacks:{title:items=>`Data: ${points[items[0].dataIndex].date}`,label:ctx=>`${ctx.dataset.label}: ${n(ctx.parsed.y)} kg`}}},scales:{x:{grid:{display:false},ticks:{color:'#68766e',font:{size:11,weight:'600'},maxRotation:0,autoSkip:true,maxTicksLimit:6}},y:{grid:{color:'#e7eeea'},ticks:{color:'#68766e',font:{size:11,weight:'600'},callback:value=>`${value} kg`}}}}})} function render(){destroyCharts();const content=state.view==='inicio'?overview():state.view==='registrar'?recordForm():state.view==='historico'?history():state.view==='metas'?goalsPage():state.view==='evolucao'?evolution():settings();$('#content').innerHTML=content;if(state.view==='registrar'&&!state.editingRecord)restoreRecordDraft();if(state.view==='inicio')requestAnimationFrame(()=>drawHomeWeightChart());if(state.view==='evolucao')requestAnimationFrame(()=>drawCharts())}function editRecord(i){const record=state.records.find(r=>r.id===i);if(!record){notice('Registro não encontrado','error');return}state.editingRecord=record;state.view='registrar';state.editingGoal=null;state.showGoalForm=false;scrollTo(0,0);layout()}registerPWA();layout();
</script>
